<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jeu - Ramasse les pièces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: min(80vh, 400px);
            height: min(80vh, 400px);
            background: #2d3436;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #score {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.6);
            transition: transform 0.1s ease-out;
        }

        #player::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        .coin {
            position: absolute;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.6), inset -3px -3px 8px rgba(0,0,0,0.3);
        }

        .coin::before {
            content: '$';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #b8860b;
            font-weight: bold;
            font-size: 20px;
        }

        .coin.collected {
            opacity: 0;
            transform: scale(0.5);
        }

        #start-screen, #win-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 13px;
        }

        #start-screen h1, #win-screen h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #restart-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        .controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: grid;
            grid-template-columns: 40px 40px;
            grid-template-rows: 40px 40px;
            gap: 8px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .control-btn:active {
            background: rgba(52, 152, 219, 0.6);
        }

        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 2; grid-row: 2; }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 15px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        @media (max-width: 500px) {
            #game-container {
                width: min(90vh, 380px);
                height: min(90vh, 380px);
            }
            
            .controls {
                bottom: 10px;
                right: 10px;
            }

            .control-btn {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score">Score: 0 / 5</div>

        <div id="player"></div>

        <div id="start-screen">
            <h1>🎮 Ramasse les pièces!</h1>
            <button id="restart-btn" class="btn">Commencer</button>
        </div>

        <div id="win-screen" style="display: none;">
            <h1>🎉 Victoire!</h1>
            <p style="color: #fff; font-size: 20px; margin-bottom: 20px;">Score final: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn">Recommencer</button>
        </div>

        <div class="controls">
            <div id="up" class="control-btn">▲</div>
            <div id="left" class="control-btn">◀</div>
            <div id="down" class="control-btn">▼</div>
            <div id="right" class="control-btn">▶</div>
        </div>

        <div class="instructions">Flèches ou ZQSD pour bouger</div>
    </div>

    <script>
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const winScreen = document.getElementById('win-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtns = document.querySelectorAll('#restart-btn');

        let playerX = 50;
        let playerY = 50;
        let coins = [];
        let score = 0;
        let gameActive = false;
        const container = document.getElementById('game-container');
        const coinCount = 5;

        function initGame() {
            playerX = 50;
            playerY = 50;
            score = 0;
            coins = [];
            
            updatePlayerPosition();
            updateScore();
            spawnCoins();
            gameActive = true;
            
            startScreen.style.display = 'none';
            winScreen.style.display = 'none';
        }

        function spawnCoins() {
            const containerRect = container.getBoundingClientRect();
            
            for (let i = 0; i < coinCount; i++) {
                let x, y;
                do {
                    x = Math.random() * (containerRect.width - 50) + 25;
                    y = Math.random() * (containerRect.height - 50) + 25;
                } while (Math.abs(x - playerX) < 40 && Math.abs(y - playerY) < 40);

                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.style.left = x + 'px';
                coin.style.top = y + 'px';
                
                coins.push({ element: coin, collected: false });
            }
        }

        function updatePlayerPosition() {
            player.style.transform = `translate(${playerX}px, ${playerY}px)`;
        }

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score} / ${coinCount}`;
            
            if (score >= coinCount) {
                gameActive = false;
                finalScoreDisplay.textContent = score;
                winScreen.style.display = 'flex';
            }
        }

        function movePlayer(dx, dy) {
            if (!gameActive) return;

            const containerRect = container.getBoundingClientRect();
            
            playerX += dx * 5;
            playerY += dy * 5;

            playerX = Math.max(0, Math.min(playerX, containerRect.width - 40));
            playerY = Math.max(0, Math.min(playerY, containerRect.height - 40));

            updatePlayerPosition();
            checkCoinCollision();
        }

        function checkCoinCollision() {
            coins.forEach(coinObj => {
                if (!coinObj.collected) {
                    const coinX = parseFloat(coinObj.element.style.left);
                    const coinY = parseFloat(coinObj.element.style.top);
                    
                    const dx = playerX - coinX;
                    const dy = playerY - coinY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 35) {
                        coinObj.collected = true;
                        coinObj.element.classList.add('collected');
                        score++;
                        updateScore();
                        
                        if (score >= coinCount) {
                            gameActive = false;
                            finalScoreDisplay.textContent = score;
                            winScreen.style.display = 'flex';
                        } else {
                            setTimeout(spawnCoins, 300);
                        }
                    }
                }
            });
        }

        function handleInput(key) {
            switch(key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                case 'z':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                case 'q':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                case 'd':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                case 'z':
                    movePlayer(1, 0);
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            handleInput(key);
        });

        document.getElementById('up').addEventListener('touchstart', () => {
            if (!gameActive) return;
            movePlayer(0, -1);
        });

        document.getElementById('down').addEventListener('touchstart', () => {
            if (!gameActive) return;
            movePlayer(0, 1);
        });

        document.getElementById('left').addEventListener('touchstart', () => {
            if (!gameActive) return;
            movePlayer(-1, 0);
        });

        document.getElementById('right').addEventListener('touchstart', () => {
            if (!gameActive) return;
            movePlayer(1, 0);
        });

        restartBtns.forEach(btn => {
            btn.addEventListener('click', initGame);
        });

        // Support pour la souris sur mobile
        document.getElementById('up').addEventListener('mousedown', () => {
            if (!gameActive) return;
            movePlayer(0, -1);
        });

        document.getElementById('down').addEventListener('mousedown', () => {
            if (!gameActive) return;
            movePlayer(0, 1);
        });

        document.getElementById('left').addEventListener('mousedown', () => {
            if (!gameActive) return;
            movePlayer(-1, 0);
        });

        document.getElementById('right').addEventListener('mousedown', () => {
            if (!gameActive) return;
            movePlayer(1, 0);
        });

        // Initialisation au chargement
        initGame();
    </script>
</body>
</html>
